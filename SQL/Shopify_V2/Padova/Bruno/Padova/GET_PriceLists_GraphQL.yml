info:
  name: GET_PriceLists_GraphQL
  type: graphql
  seq: 1

graphql:
  method: POST
  url: "{{Padova-GraphQL-URL}}"
  headers:
    - name: X-Shopify-Access-Token
      value: "{{X-Shopify-Access-Token}}"
    - name: Content-Type
      value: application/json
  body:
    query: |
      query {
        priceLists(first: 10) {
          edges {
            node {
              id
              name
              currency
              parent {
                adjustment {
                  type
                  value
                }
              }
            }
          }
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
